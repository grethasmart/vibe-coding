<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Decision Maker</title>
  <style>
    :root {
      --bg-top: #fef3c7;
      --bg-mid: #fce7f3;
      --bg-bottom: #e0e7ff;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --primary: #f97316;
      --primary-hover: #ea580c;
      --accent-purple: #8b5cf6;
      --accent-purple-hover: #7c3aed;
      --error-bg: #fff1f2;
      --error-border: #fda4af;
      --error-text: #e11d48;
      --winner-bg: #fef9c3;
      --winner-border: #facc15;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--bg-top) 0%, var(--bg-mid) 50%, var(--bg-bottom) 100%);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: var(--text-main);
      padding: 24px 16px;
    }

    .app-card {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border-radius: 24px;
      padding: 32px 28px;
      box-shadow: 0 18px 40px rgba(30, 41, 59, 0.08), 0 4px 12px rgba(30, 41, 59, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.8);
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 22px;
    }

    /* Result Display Box */
    .display-box {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      min-height: 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      margin-bottom: 24px;
      transition: all 0.25s ease;
    }

    .display-box.active {
      background: #f5f3ff;
      border-color: #c4b5fd;
    }

    .display-box.winner {
      background: var(--winner-bg);
      border-color: var(--winner-border);
      box-shadow: 0 8px 20px rgba(250, 204, 21, 0.25);
    }

    .display-box.error {
      background: var(--error-bg);
      border-color: var(--error-border);
    }

    .status-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 1.4px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 700;
    }

    .display-box.winner .status-label {
      color: #b45309;
    }

    .display-box.error .status-label {
      color: var(--error-text);
    }

    .result-text {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text-main);
      word-break: break-word;
    }

    .display-box.winner .result-text {
      font-size: 1.65rem;
      color: #9a3412;
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .display-box.error .result-text {
      color: var(--error-text);
      font-size: 0.98rem;
      font-weight: 600;
    }

    /* Options Section */
    .input-section {
      text-align: left;
      margin-bottom: 22px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .input-label {
      font-size: 0.9rem;
      color: var(--text-main);
      font-weight: 700;
    }

    .box-counter {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .option-input {
      flex: 1;
      padding: 12px 15px;
      border-radius: 12px;
      border: 2px solid #e2e8f0;
      background: #f8fafc;
      color: var(--text-main);
      font-size: 0.98rem;
      outline: none;
      transition: all 0.15s ease;
    }

    .option-input::placeholder {
      color: #94a3b8;
    }

    .option-input:focus {
      border-color: var(--accent-purple);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.12);
    }

    /* Highlight state when shuffling or winning */
    .option-input.highlighting {
      border-color: var(--accent-purple);
      background: #f5f3ff;
      transform: scale(1.02);
    }

    .option-input.winning-box {
      border-color: #f59e0b;
      background: #fef9c3;
      font-weight: 700;
      transform: scale(1.02);
    }

    .remove-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      color: #94a3b8;
      font-size: 1.2rem;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .remove-btn:hover {
      background: #fee2e2;
      border-color: #fca5a5;
      color: #ef4444;
    }

    /* + Add Option Button */
    .add-btn-wrapper {
      display: flex;
      justify-content: center;
      margin-top: 12px;
    }

    .add-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 10px;
      border-radius: 12px;
      border: 2px dashed #cbd5e1;
      background: #f8fafc;
      color: #475569;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .add-btn span.plus-icon {
      font-size: 1.2rem;
      line-height: 1;
      color: var(--accent-purple);
    }

    .add-btn:hover:not(:disabled) {
      border-color: var(--accent-purple);
      background: #f5f3ff;
      color: var(--accent-purple);
    }

    .add-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Bottom Action Buttons */
    .btn-row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    .decide-btn {
      flex: 1;
      padding: 14px 24px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: #ffffff;
      font-weight: 800;
      font-size: 1.05rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(249, 115, 22, 0.3);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .decide-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(249, 115, 22, 0.4);
    }

    .decide-btn:active {
      transform: translateY(0);
    }

    .clear-btn {
      padding: 14px 18px;
      border-radius: 14px;
      border: 2px solid #e2e8f0;
      background: #ffffff;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .clear-btn:hover {
      background: #f1f5f9;
      color: var(--text-main);
    }

    /* Copy Link Button Row */
    .share-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .copy-link-btn {
      width: 100%;
      padding: 12px 18px;
      border-radius: 14px;
      border: 2px solid #ddd6fe;
      background: #f5f3ff;
      color: var(--accent-purple);
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .copy-link-btn:hover {
      background: #ede9fe;
      border-color: var(--accent-purple);
    }

    .copy-link-btn.copied {
      background: #ecfdf5;
      border-color: #6ee7b7;
      color: #059669;
    }

    .privacy-note {
      font-size: 0.76rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0.4; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes errorShake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-7px); }
      40%, 80% { transform: translateX(7px); }
    }

    .shake-error {
      animation: errorShake 0.4s ease;
    }
  </style>
</head>
<body>

  <div class="app-card" id="appCard">
    <h1>Decision Maker</h1>
    <p class="subtitle">Enter your choices below and press <strong>Decide</strong>.</p>

    <!-- Result Screen -->
    <div class="display-box" id="displayBox">
      <div class="status-label" id="statusLabel">Ready when you are</div>
      <div class="result-text" id="resultText">What are we choosing between?</div>
    </div>

    <!-- User Options Section -->
    <div class="input-section">
      <div class="section-header">
        <label class="input-label">Your Options</label>
        <span class="box-counter" id="boxCounter">3 of 6 boxes</span>
      </div>

      <div class="options-list" id="optionsList">
        <!-- 3 Default Boxes -->
        <div class="option-row">
          <input type="text" class="option-input" placeholder="Option 1" autocomplete="off">
        </div>
        <div class="option-row">
          <input type="text" class="option-input" placeholder="Option 2" autocomplete="off">
        </div>
        <div class="option-row">
          <input type="text" class="option-input" placeholder="Option 3" autocomplete="off">
        </div>
      </div>

      <!-- + Button to add up to 6 boxes -->
      <div class="add-btn-wrapper">
        <button type="button" class="add-btn" id="addBoxBtn" title="Add another option box">
          <span class="plus-icon">+</span> Add Option
        </button>
      </div>
    </div>

    <!-- Main Buttons -->
    <div class="btn-row">
      <button class="decide-btn" id="decideBtn">Decide</button>
      <button class="clear-btn" id="clearBtn">Reset</button>
    </div>

    <!-- Share / Copy Link Button -->
    <div class="share-row">
      <button type="button" class="copy-link-btn" id="copyLinkBtn">🔗 Copy link</button>
      <p class="privacy-note">Note: Anyone with the link can read the list right in the address.</p>
    </div>
  </div>

  <script>
    const optionsList = document.getElementById('optionsList');
    const addBoxBtn = document.getElementById('addBoxBtn');
    const boxCounter = document.getElementById('boxCounter');
    const decideBtn = document.getElementById('decideBtn');
    const clearBtn = document.getElementById('clearBtn');
    const copyLinkBtn = document.getElementById('copyLinkBtn');
    const displayBox = document.getElementById('displayBox');
    const statusLabel = document.getElementById('statusLabel');
    const resultText = document.getElementById('resultText');
    const appCard = document.getElementById('appCard');

    const MIN_BOXES = 3;
    const MAX_BOXES = 6;
    let isSpinning = false;

    // Update placeholders and the "X of 6 boxes" counter
    function updateBoxUI() {
      const rows = optionsList.querySelectorAll('.option-row');
      const count = rows.length;

      rows.forEach((row, index) => {
        const input = row.querySelector('.option-input');
        input.placeholder = `Option ${index + 1}`;
      });

      boxCounter.textContent = `${count} of ${MAX_BOXES} boxes`;

      if (count >= MAX_BOXES) {
        addBoxBtn.disabled = true;
        addBoxBtn.innerHTML = 'Maximum 6 options reached';
      } else {
        addBoxBtn.disabled = false;
        addBoxBtn.innerHTML = '<span class="plus-icon">+</span> Add Option';
      }
    }

    // Helper function to create an extra option row (boxes 4 to 6)
    function createOptionRow(initialValue = '') {
      const currentBoxes = optionsList.querySelectorAll('.option-row').length;
      if (currentBoxes >= MAX_BOXES) return null;

      const row = document.createElement('div');
      row.className = 'option-row';

      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'option-input';
      input.autocomplete = 'off';
      input.value = initialValue;

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') makeDecision();
      });

      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'remove-btn';
      removeBtn.innerHTML = '&times;';
      removeBtn.title = 'Remove this box';

      removeBtn.addEventListener('click', () => {
        if (isSpinning) return;
        row.remove();
        updateBoxUI();
      });

      row.appendChild(input);
      row.appendChild(removeBtn);
      optionsList.appendChild(row);

      updateBoxUI();
      return input;
    }

    // Add a new option input box when clicking + Add Option
    addBoxBtn.addEventListener('click', () => {
      if (isSpinning) return;
      const newInput = createOptionRow();
      if (newInput) newInput.focus();
    });

    // Show helpful message when someone uses it wrong
    function showError(message) {
      displayBox.className = 'display-box error';
      statusLabel.textContent = 'Hold Up!';
      resultText.textContent = message;

      appCard.classList.remove('shake-error');
      void appCard.offsetWidth;
      appCard.classList.add('shake-error');
    }

    // Get all non-empty option strings
    function getFilledOptions() {
      const allInputs = Array.from(optionsList.querySelectorAll('.option-input'));
      return allInputs
        .map(input => input.value.trim())
        .filter(val => val.length > 0);
    }

    // Build the URL with ?options=Item1,Item2,Item3
    function buildShareableURL() {
      const options = getFilledOptions();
      const baseUrl = window.location.href.split('?')[0];

      if (options.length === 0) {
        return baseUrl;
      }

      const encodedList = options.map(opt => encodeURIComponent(opt)).join(',');
      return `${baseUrl}?options=${encodedList}`;
    }

    // Copy Link button handler
    copyLinkBtn.addEventListener('click', () => {
      const options = getFilledOptions();

      if (options.length === 0) {
        showError('Type some options into the boxes first before copying a link!');
        return;
      }

      const shareUrl = buildShareableURL();

      // Also update the browser's current address bar so refreshing keeps the list
      window.history.replaceState(null, '', shareUrl);

      navigator.clipboard.writeText(shareUrl).then(() => {
        copyLinkBtn.classList.add('copied');
        copyLinkBtn.textContent = '✅ Link copied to clipboard!';
        setTimeout(() => {
          copyLinkBtn.classList.remove('copied');
          copyLinkBtn.textContent = '🔗 Copy link';
        }, 2200);
      }).catch(() => {
        // Fallback if clipboard permissions are blocked on local files
        prompt('Copy your shareable link below:', shareUrl);
      });
    });

    // Load options from URL (?options=Pizza,Tacos,Sushi) when the page opens
    function loadOptionsFromURL() {
      const params = new URLSearchParams(window.location.search);
      const rawOptions = params.get('options');

      if (!rawOptions) return;

      const parsedOptions = rawOptions
        .split(',')
        .map(item => decodeURIComponent(item).trim())
        .filter(item => item.length > 0)
        .slice(0, MAX_BOXES);

      if (parsedOptions.length === 0) return;

      const existingInputs = Array.from(optionsList.querySelectorAll('.option-input'));

      parsedOptions.forEach((optText, index) => {
        if (index < existingInputs.length) {
          existingInputs[index].value = optText;
        } else {
          createOptionRow(optText);
        }
      });

      statusLabel.textContent = 'Loaded from link';
      resultText.textContent = `${parsedOptions.length} options ready — press Decide!`;
    }

    function makeDecision() {
      if (isSpinning) return;

      const allInputs = Array.from(optionsList.querySelectorAll('.option-input'));
      allInputs.forEach(input => input.classList.remove('highlighting', 'winning-box'));

      const filledInputs = allInputs.filter(input => input.value.trim().length > 0);
      const options = filledInputs.map(input => input.value.trim());

      if (options.length === 0) {
        showError('Give me something to work with! Fill in at least 2 boxes first.');
        allInputs[0].focus();
        return;
      }

      if (options.length === 1) {
        showError(`Only "${options[0]}"? Add at least one more option so I can decide!`);
        const firstEmpty = allInputs.find(input => input.value.trim().length === 0);
        if (firstEmpty) firstEmpty.focus();
        return;
      }

      const uniqueOptions = new Set(options.map(o => o.toLowerCase()));
      if (uniqueOptions.size === 1) {
        showError('Trying to rig the game? Those options are all the same!');
        return;
      }

      // Sync the URL bar automatically when deciding
      window.history.replaceState(null, '', buildShareableURL());

      isSpinning = true;
      displayBox.className = 'display-box active';
      statusLabel.textContent = 'Deciding...';

      let steps = 0;
      const totalSteps = 16;
      let currentInterval = 70;

      function spinStep() {
        filledInputs.forEach(input => input.classList.remove('highlighting', 'winning-box'));

        const randomIndex = Math.floor(Math.random() * filledInputs.length);
        const chosenInput = filledInputs[randomIndex];

        resultText.textContent = chosenInput.value.trim();
        chosenInput.classList.add('highlighting');

        steps++;

        if (steps < totalSteps) {
          if (steps > totalSteps - 5) currentInterval += 45;
          setTimeout(spinStep, currentInterval);
        } else {
          const winnerIndex = Math.floor(Math.random() * filledInputs.length);
          const winningInput = filledInputs[winnerIndex];
          const winnerText = winningInput.value.trim();

          filledInputs.forEach(input => input.classList.remove('highlighting'));
          winningInput.classList.add('winning-box');

          displayBox.className = 'display-box winner';
          statusLabel.textContent = 'The Winner Is';
          resultText.textContent = `🎉 ${winnerText} 🎉`;
          isSpinning = false;
        }
      }

      spinStep();
    }

    decideBtn.addEventListener('click', makeDecision);

    optionsList.querySelectorAll('.option-input').forEach(input => {
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') makeDecision();
      });
    });

    // Reset button clears text, removes URL parameters, and restores default 3 boxes
    clearBtn.addEventListener('click', () => {
      if (isSpinning) return;
      const rows = Array.from(optionsList.querySelectorAll('.option-row'));

      rows.forEach((row, index) => {
        if (index >= MIN_BOXES) {
          row.remove();
        } else {
          const input = row.querySelector('.option-input');
          input.value = '';
          input.classList.remove('highlighting', 'winning-box');
        }
      });

      window.history.replaceState(null, '', window.location.href.split('?')[0]);
      updateBoxUI();
      displayBox.className = 'display-box';
      statusLabel.textContent = 'Ready when you are';
      resultText.textContent = 'What are we choosing between?';
      optionsList.querySelector('.option-input').focus();
    });

    // Check if the URL already has ?options=... on page load
    loadOptionsFromURL();
  </script>
</body>
</html>
