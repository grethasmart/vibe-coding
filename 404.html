<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Gretha Smart</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #475569;
      --accent: #6d28d9;
      --accent-hover: #5b21b6;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .error-card {
      max-width: 480px;
      width: 100%;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-top: 5px solid var(--accent);
      border-radius: 14px;
      padding: 2.75rem 2rem;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }

    .error-code {
      font-size: 4.5rem;
      font-weight: 800;
      color: var(--accent);
      line-height: 1;
      letter-spacing: -0.03em;
      margin-bottom: 0.75rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }

    p {
      color: var(--text-muted);
      font-size: 1rem;
      margin-bottom: 2rem;
    }

    .home-btn {
      display: inline-block;
      background-color: var(--accent);
      color: #ffffff;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      padding: 0.8rem 1.6rem;
      border-radius: 8px;
      transition: background-color 0.2s ease, transform 0.15s ease;
    }

    .home-btn:hover {
      background-color: var(--accent-hover);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <main class="error-card">
    <div class="error-code">404</div>
    <h1>Looks like this page took a detour.</h1>
    <p>The web address you entered doesn't exist or may have been moved to a new folder.</p>
    <a href="https://grethasmart.github.io/vibe-coding/" class="home-btn">Back to Project Directory</a>
  </main>

</body>
</html>
