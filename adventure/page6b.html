<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NYC Good Neighbor Day - Room to Grow</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body>
  <div id="app" class="relative h-screen w-full bg-slate-900 overflow-hidden" 
       style="background-image: url('./images/finale_casual.jpeg'); background-size: cover; background-position: center top; background-repeat: no-repeat;">
    
    <div class="absolute top-0 left-0 w-full p-6 md:p-8 flex justify-between items-start z-20">
      <div class="flex flex-col gap-1">
        <h1 class="text-[#ffbc00] font-extrabold text-xl md:text-2xl tracking-widest uppercase drop-shadow-[0_4px_6px_rgba(0,0,0,0.9)]">
          NYC Good Neighbor Day
        </h1>
        <h2 class="text-[#ffbc00] font-bold text-base md:text-lg uppercase tracking-wide drop-shadow-[0_3px_5px_rgba(0,0,0,0.9)]">
          FINALE: ROOM TO GROW
        </h2>
      </div>
      <div class="flex gap-3">
        <a href="index.html" class="bg-black/50 backdrop-blur-md border border-white/20 text-white px-4 py-2 rounded-lg font-semibold text-xs md:text-sm hover:bg-black/70 transition-colors shadow-lg cursor-pointer block">
          Play Again
        </a>
      </div>
    </div>

    <div class="absolute bottom-0 left-0 w-full bg-gradient-to-t from-slate-950 via-slate-900/90 to-transparent pt-24 pb-6 px-6 md:px-10 flex flex-col md:flex-row justify-between items-end gap-6 md:gap-10 z-10">
      <div class="text-white text-lg md:text-xl font-medium w-full leading-tight drop-shadow-lg">
        Hey, you survived the day, but you still have some work to do on your neighborly skills! The Mayor's Office has a bunch of great resources and local neighborhood initiatives you can sign up for to help out your block.
      </div>
      <div class="shrink-0 flex gap-4">
        <a href="index.html" class="bg-[#ffbc00] text-slate-950 px-8 py-3.5 rounded-xl font-extrabold text-base md:text-lg shadow-[0_4px_14px_rgba(255,188,0,0.3)] hover:scale-105 transition-all cursor-pointer flex items-center gap-2">
          SIGN UP & RESET ➔
        </a>
      </div>
    </div>
  </div>
</body>
</html>
